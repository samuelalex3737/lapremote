[project]
name = "lapremote"
version = "0.1.0"
description = "LapRemote agent - control your laptop from your phone"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.165.0",
    "mss>=10.2.0",
    "pydantic>=2.14.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
lapremote = "lapremote.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lapremote"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["lapremote/static"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH",
  "S", "ASYNC", "RUF", "PL", "TRY", "PERF", "ANN",
]
ignore = ["PLR2004", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["lapremote", "tests", "../scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
