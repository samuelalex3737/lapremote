[project]
name = "lapremote"
version = "1.0.0"
description = "LapRemote agent - control your laptop from your phone"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "comtypes>=1.5.0 ; sys_platform == 'win32'",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "mss>=10.2.0",
    "pillow>=13.0.0",
    "psutil>=7.2.2",
    "pycaw>=20260927 ; sys_platform == 'win32'",
    "pydantic>=2.14.3",
    "pynput>=1.8.2",
    "pyobjc-framework-cocoa>=13.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=13.0 ; sys_platform == 'darwin'",
    "pystray>=0.19.5",
    "pywin32>=312 ; sys_platform == 'win32'",
    "qrcode>=8.2",
    "screen-brightness-control>=0.27.2 ; sys_platform != 'darwin'",
    "uvicorn[standard]>=0.54.0",
    "winrt-windows-foundation>=4!10.0.28000.2957 ; sys_platform == 'win32'",
    "winrt-windows-foundation-collections>=4!10.0.28000.2957 ; sys_platform == 'win32'",
    "winrt-windows-media-control>=4!10.0.28000.2957 ; sys_platform == 'win32'",
    "winrt-windows-storage-streams>=4!10.0.28000.2957 ; sys_platform == 'win32'",
    "zeroconf>=0.154.0",
]

[project.scripts]
lapremote = "lapremote.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lapremote"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
    "types-pillow>=10.2.0.20240822",
    "types-psutil>=7.2.2.20261111",
    "types-pynput>=1.8.1.20260712",
    "types-pywin32>=312.0.0.20261104",
    "types-qrcode>=8.2.0.20260518",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["lapremote/static"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH",
  "S", "ASYNC", "RUF", "PL", "TRY", "PERF", "ANN",
]
ignore = ["PLR2004", "TRY003"]

[tool.ruff.lint.pylint]
max-args = 8
max-returns = 12

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004", "S104", "S105", "S106", "S108"]
# WinRT and COM objects are dynamically typed.
"lapremote/media/windows.py" = ["ANN401"]
"lapremote/system/volume.py" = ["ANN401"]
"lapremote/preview/capture.py" = ["ANN401"]
# make_app mirrors create_app's keyword knobs.
"tests/wsclient.py" = ["PLR0913"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["lapremote", "tests", "../scripts"]

[[tool.mypy.overrides]]
# No type information is published for these packages.
module = ["pycaw.*", "comtypes.*", "screen_brightness_control.*", "pystray.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.uv]
# Smart App Control blocks zeroconf's unsigned Cython extensions on Windows,
# so it is built from source in its pure-Python mode instead.
no-binary-package = ["zeroconf"]
# Prefer an installed, signed Python (python.org) over uv's downloaded builds: Smart App
# Control can block the unsigned DLLs in those builds (it blocked asyncio's _overlapped).
python-preference = "system"

[tool.uv.extra-build-variables]
zeroconf = { SKIP_CYTHON = "1" }
